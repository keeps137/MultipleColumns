# GitHub Actions 编译工作流（幽灵层模组）
# 用法：上传到 GitHub 后，把本文件移动到仓库的 .github/workflows/build.yml
# （GitHub 网页端：Add file -> Create new file，路径输入 .github/workflows/build.yml，粘贴本文件内容即可）
name: Build GhostLayer
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build
        run: gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: GhostLayer
          path: build/libs/*.jar
